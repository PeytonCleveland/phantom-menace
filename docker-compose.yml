services:
  db:
    image: postgres:17
    container_name: lighthouse-db
    environment:
      POSTGRES_USER: lighthouse
      POSTGRES_PASSWORD: lighthouse
      POSTGRES_DB: lighthouse
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lighthouse -d lighthouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
